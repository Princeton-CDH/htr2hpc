name: unit tests

on:
  push:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Wagtail is an optional dependency; test with and without it to keep it optional.
    # Content management tests are skipped when Wagtail isn't installed.
    strategy:
      fail-fast: false
      matrix:
        wagtail: [false, true]
    name: test (wagtail ${{ matrix.wagtail && 'installed' || 'not installed' }})

    steps:
      - name: Check out htr2hpc
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install htr2hpc with dev dependencies
        run: uv sync --group dev ${{ matrix.wagtail && '--extra wagtail' || '' }}

      - name: Run tests with coverage
        env:
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-test-secret
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests,${{ matrix.wagtail && 'with-wagtail' || 'without-wagtail' }}
          token: ${{ secrets.CODECOV_TOKEN }}
