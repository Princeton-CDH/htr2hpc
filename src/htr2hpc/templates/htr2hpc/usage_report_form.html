{% load i18n %}
<form method="get" action="{% url 'usage-report' %}" class="form-inline mb-3">
  <label class="mr-2" for="{{ form.start.id_for_label }}">{% trans "Usage report from" %}</label>
  <span class="mr-2">{{ form.start }}</span>
  <span class="mr-2">{{ form.report_type }}</span>
  <button type="submit" class="btn btn-sm btn-secondary">{% trans "Download CSV" %}</button>
</form>
